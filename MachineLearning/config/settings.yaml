project:
  name: SmartCropAdvisor
  version: 1.0.0
  random_state: 42

data:
  raw_path: data/soil_quality_crop_recommendation_dataset.csv
  target_column: label
  feature_columns:
    - N
    - P
    - K
    - temperature
    - humidity
    - ph
    - rainfall
  min_samples_per_class: 5
  domain_bounds:
    N: [0.0, 500.0]
    P: [0.0, 500.0]
    K: [0.0, 500.0]
    temperature: [-10.0, 60.0]
    humidity: [0.0, 100.0]
    ph: [0.0, 14.0]
    rainfall: [0.0, 1000.0]

split:
  test_size: 0.2
  stratify: true

evaluation:
  cv_folds: 5
  primary_metric: f1_macro
  secondary_metric: accuracy

artifacts:
  dir: artifacts
  eda_plots_dir: artifacts/plots/eda
  eval_plots_dir: artifacts/plots/eval
  model_filename: model_pipeline.joblib
  metadata_filename: metadata.json

models:
  GaussianNB:
    enabled: true
    params: {}
  RandomForestClassifier:
    enabled: true
    params:
      n_estimators: 100
      random_state: 42
      n_jobs: -1
  MLPClassifier:
    enabled: true
    params:
      hidden_layer_sizes: [100, 50]
      max_iter: 500
      random_state: 42
